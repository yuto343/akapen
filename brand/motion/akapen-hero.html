<script>
(() => {
  const INTRO = 0.55, WRITE = 3.4, SETTLE = 0.45;            // 秒
  const TOTAL = INTRO + WRITE + SETTLE;
  const stroke = document.getElementById('akapen-stroke');
  const hand = document.getElementById('akapen-hand');
  const L = stroke.getTotalLength();
  stroke.style.strokeDasharray = L;
  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;  // easeInOutCubic
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const at = len => { const p = stroke.getPointAtLength(len); return { x: p.x + 100, y: p.y + 60 }; };
  const start = at(0), end = at(L);

  function render(t) {
    let x, y, rot = 0, op = 1, drawn = 0;
    if (t < INTRO) {                       // 左から手が入ってくる
      const k = easeOut(t / INTRO);
      x = start.x - 140 * (1 - k); y = start.y + 30 * (1 - k); op = k; rot = -8 * (1 - k);
    } else if (t < INTRO + WRITE) {        // 書く
      const k = ease((t - INTRO) / WRITE);
      drawn = L * k; ({ x, y } = at(drawn));
      rot = Math.sin((t - INTRO) * 16) * 2.2;  // 筆圧っぽい小さな揺れ
    } else {                               // 書き終わりで少し浮いて戻る
      const k = Math.min(1, (t - INTRO - WRITE) / SETTLE);
      drawn = L; x = end.x; y = end.y - Math.sin(k * Math.PI) * 10;
    }
    stroke.style.strokeDashoffset = L - drawn;
    hand.setAttribute('transform', `translate(${x} ${y}) rotate(${rot})`);
    hand.style.opacity = op;
  }

  const params = new URLSearchParams(location.search);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (params.has('t')) { render(parseFloat(params.get('t'))); return; }   // 静止フレーム書き出し用
  if (reduce) { render(TOTAL); return; }

  let t0 = null, raf = 0;
  const loop = now => {
    if (t0 === null) t0 = now;
    const t = (now - t0) / 1000;
    render(Math.min(t, TOTAL));
    if (t < TOTAL) raf = requestAnimationFrame(loop);
  };
  const play = () => { cancelAnimationFrame(raf); t0 = null; render(0); raf = requestAnimationFrame(loop); };
  document.querySelector('.akapen-hero').addEventListener('click', play);
  setTimeout(play, 300);
})();
</script>
