name: akapen
options:
  minimumXcodeGenVersion: 2.47.0
  deploymentTarget:
    macOS: "15.0"
packages:
  AkapenKit:
    path: Packages/AkapenKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: G5564YSC93
    CODE_SIGN_IDENTITY: Apple Development
    CODE_SIGN_STYLE: Manual
    ENABLE_APP_SANDBOX: NO
    LM_SKIP_METADATA_EXTRACTION: YES
    GENERATE_INFOPLIST_FILE: YES
targets:
  akapen:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuto343.akapen
        # 版。pnpm release:mac <x.y.z> が両方を x.y.z で上書きする（Sparkle は CFBundleVersion で比べるので同じ値にそろえる）。
        MARKETING_VERSION: 0.0.0
        CURRENT_PROJECT_VERSION: 0.0.0
        # 生成する Info.plist に、Sparkle の独自キー（SUFeedURL・SUPublicEDKey・SUEnableAutomaticChecks）を足す。
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # 配布するビルド。Debug は Apple Development のまま（手元の画面収録の許可を保つため）。
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: --timestamp
    dependencies:
      - package: AkapenKit
        product: AkapenApp
  SampleTarget:
    type: application
    platform: macOS
    sources: [e2e/sample-target]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuto343.akapen.SampleTarget
    dependencies:
      - package: AkapenKit
        product: AkapenAXID
  AkapenE2E:
    type: bundle.ui-testing
    platform: macOS
    sources: [e2e/tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuto343.akapen.E2E
        TEST_TARGET_NAME: akapen
    dependencies:
      - target: akapen
      - target: SampleTarget
      - package: AkapenKit
        product: AkapenAXID
schemes:
  akapen:
    build:
      targets:
        akapen: all
        # アーカイブ（pnpm release:mac）には入れない。
        SampleTarget: [running, testing, profiling, analyzing]
        AkapenE2E: [test]
    test:
      targets: [AkapenE2E]
      gatherCoverageData: false
